<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ペット詳細｜ペットシェアアプリ</title>


    <!-- ペット詳細CSS -->
    <link rel="stylesheet"
          href="pet-detail.css">


    <!-- 共通ハンバーガーメニューCSS -->
    <link rel="stylesheet"
          href="common-menu.css">


    <!-- 共通下部ナビゲーションCSS -->
    <link rel="stylesheet"
          href="bottom-nav.css">

</head>


<body>


<!-- =========================
     ヘッダー
========================== -->

<header class="header">

    <div class="header-inner">

        <a href="home.html"
           class="back-button">
            ←
        </a>

        <h1>
            ペット詳細
        </h1>

    </div>

</header>



<!-- =========================
     ハンバーガーメニュー
========================== -->

<!--
    common-menu.jsがこの要素を使用して
    メニューの開閉を行います
-->

<button
    type="button"
    id="menuButton"
    class="menu-button"
    aria-label="メニューを開く">
    ☰
</button>


<!-- 背景オーバーレイ -->

<div
    id="menuOverlay"
    class="menu-overlay">
</div>



<!-- =========================
     サイドメニュー
========================== -->

<aside
    id="sideMenu"
    class="side-menu">


    <!-- メニューヘッダー -->

    <div class="side-menu-header">

        <h2 class="side-menu-title">
            メニュー
        </h2>


        <button
            type="button"
            id="closeMenuButton"
            class="close-menu-button"
            aria-label="メニューを閉じる">
            ×
        </button>

    </div>



    <!-- メニュー項目 -->

    <div class="side-menu-list">


        <!-- アカウント -->

        <a href="mypage.jsp">
            👤 マイページ
        </a>


        <a href="profile-edit.html">
            ✏️ プロフィール編集
        </a>


        <a href="my-posts.html">
            📋 自分の投稿
        </a>


        <a href="likes.html">
            ❤️ いいねしたペット
        </a>



        <!-- ペットシェア -->

        <a href="share-history.html">
            🐾 シェア履歴
        </a>


        <a href="application-status.html">
            📅 申し込み状況
        </a>


        <a href="chat.html">
            💬 チャット
        </a>



        <!-- サポート -->

        <a href="faq.html">
            ❓ よくある質問
        </a>


        <a href="terms.html"
           id="termsLink">
            📖 利用規約
        </a>


        <a href="privacy.html">
            🔒 プライバシーポリシー
        </a>


        <a href="contact.html">
            📩 お問い合わせ
        </a>



        <!-- その他 -->

        <a href="settings.html">
            ⚙️ 設定
        </a>


        <button
            type="button"
            id="logoutButton"
            class="menu-button-item">
            🚪 ログアウト
        </button>

    </div>

</aside>



<!-- =========================
     メイン
========================== -->

<main class="main">


    <!-- =========================
         ペット画像
    ========================== -->

    <section class="pet-image-section">

        <img
            id="petImage"
            class="pet-image"
            src="https://placehold.co/800x600?text=Pet+Image"
            alt="ペット画像">

    </section>



    <!-- =========================
         ペット基本情報
    ========================== -->

    <section class="pet-info">

        <div class="pet-title-area">

            <div>

                <h2 id="petName"></h2>

                <p id="petArea"></p>

            </div>


            <!-- いいね -->

            <button
                type="button"
                id="likeButton"
                class="like-button">

                ♡

                <span id="likeCount">
                    0
                </span>

            </button>

        </div>



        <!-- =========================
             詳細
        ========================== -->

        <div class="detail-list">


            <!-- 種類 -->

            <div class="detail-item">

                <span class="label">
                    種類
                </span>

                <span id="petType">
                </span>

            </div>



            <!-- 年齢 -->

            <div class="detail-item">

                <span class="label">
                    年齢
                </span>

                <span id="petAge">
                </span>

            </div>



            <!-- シェア可能期間 -->

            <div class="detail-item">

                <span class="label">
                    シェア可能期間
                </span>

                <span id="sharePeriod">
                </span>

            </div>

        </div>

    </section>



    <!-- =========================
         飼い主
    ========================== -->

    <section class="owner-section">

        <h3>
            シェアする人
        </h3>


        <div class="owner-card">

            <img
                id="ownerImage"
                class="owner-image"
                src="https://placehold.co/100x100?text=User"
                alt="プロフィール画像">


            <div class="owner-info">

                <h4 id="ownerName">
                    飼い主
                </h4>


                <!-- 星評価 -->

                <div class="rating">

                    <span class="stars">
                        ★★★★★
                    </span>

                    <span id="reviewAverage">
                        0.0
                    </span>

                </div>


                <p>
                    レビュー
                    <span id="reviewCount">
                        0
                    </span>
                    件
                </p>

            </div>

        </div>



        <!-- 自己紹介 -->

        <div class="owner-description">

            <p id="ownerDescription">
                飼い主のプロフィール情報は
                登録されていません。
            </p>

        </div>

    </section>



    <!-- =========================
         ペットについて
    ========================== -->

    <section class="description-section">

        <h3>
            ペットについて
        </h3>


        <p id="petDescription">
        </p>

    </section>



    <!-- =========================
         シェア条件
    ========================== -->

    <section class="condition-section">

        <h3>
            シェアについて
        </h3>


        <div class="condition-box">

            <p>
                シェア条件は登録されていません。
            </p>

        </div>

    </section>



    <!-- =========================
         シェア申し込み
    ========================== -->

    <section class="application-section">

        <button
            type="button"
            id="borrowButton"
            class="share-button">

            このペットを借りる

        </button>

    </section>

</main>



<!-- =========================
     JavaScript
========================== -->

<!-- ペット詳細処理 -->
<script src="pet-detail.js"></script>


<!-- 共通ハンバーガーメニュー -->
<script src="common-menu.js"></script>


<!-- 共通下部ナビゲーション -->
<script src="bottom-nav.js"></script>


</body>

</html>
