<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ペットを借りる - Pet Share</title>

    <!-- 共通CSS -->
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="design.css">
    <link rel="stylesheet" href="common-menu.css">
    <link rel="stylesheet" href="bottom-nav.css">

    <!-- このページ専用CSS -->
    <link rel="stylesheet" href="borrow-request.css">

</head>


<body>

    <!-- ========================================
         共通ハンバーガーメニュー
    ======================================== -->

    <button
        type="button"
        id="menuButton"
        class="menu-button"
        aria-label="メニューを開く">
        ☰
    </button>


    <div
        id="menuOverlay"
        class="menu-overlay">
    </div>


    <aside
        id="sideMenu"
        class="side-menu">

        <div class="side-menu-header">

            <h2 class="side-menu-title">
                メニュー
            </h2>

            <button
                type="button"
                id="closeMenuButton"
                class="close-menu-button"
                aria-label="メニューを閉じる">
                ×
            </button>

        </div>


        <div class="side-menu-list">

            <a href="mypage.jsp">
                <span class="side-menu-icon">👤</span>
                マイページ
            </a>

            <a href="profile-edit.html">
                <span class="side-menu-icon">✏️</span>
                プロフィール編集
            </a>

            <a href="my-posts.html">
                <span class="side-menu-icon">📋</span>
                自分の投稿
            </a>

            <a href="likes.html">
                <span class="side-menu-icon">❤️</span>
                いいねしたペット
            </a>

            <a href="share-history.html">
                <span class="side-menu-icon">🐾</span>
                シェア履歴
            </a>

            <a href="application-status.html">
                <span class="side-menu-icon">📅</span>
                申し込み状況
            </a>

            <a href="chat.html">
                <span class="side-menu-icon">💬</span>
                チャット
            </a>

            <a href="faq.html">
                <span class="side-menu-icon">❓</span>
                よくある質問
            </a>

            <a href="terms.html">
                <span class="side-menu-icon">📖</span>
                利用規約
            </a>

            <a href="privacy.html">
                <span class="side-menu-icon">🔒</span>
                プライバシーポリシー
            </a>

            <a href="contact.html">
                <span class="side-menu-icon">📩</span>
                お問い合わせ
            </a>

            <a href="settings.html">
                <span class="side-menu-icon">⚙️</span>
                設定
            </a>

            <button
                type="button"
                id="logoutButton">

                <span class="side-menu-icon">🚪</span>
                ログアウト

            </button>

        </div>

    </aside>


    <!-- ========================================
         申込み完了メッセージ
    ======================================== -->

    <div
        id="requestCompleteMessage"
        class="request-result-message">

        ペットの借用申込みが完了しました

    </div>


    <!-- ========================================
         申込みエラーメッセージ
    ======================================== -->

    <div
        id="requestErrorMessage"
        class="request-result-error">
    </div>


    <!-- ========================================
         メインコンテナ
    ======================================== -->

    <div class="borrow-container">


        <!-- ====================================
             タイトル
        ==================================== -->

        <h1 class="borrow-title">

            このペットを借りる

        </h1>


        <!-- ====================================
             ペット情報
        ==================================== -->

        <div class="pet-info">


            <!-- ペット画像 -->

            <img
                id="petImage"
                src="https://placehold.co/300x300?text=Pet"
                alt="ペット画像">


            <!-- ペット情報 -->

            <div class="pet-info-text">

                <h2 id="petName">

                    読み込み中...

                </h2>


                <p>

                    種類：

                    <span id="petType">
                        -
                    </span>

                </p>


                <p>

                    年齢：

                    <span id="petAge">
                        -
                    </span>

                </p>

            </div>

        </div>


        <!-- ====================================
             シェア可能期間
        ==================================== -->

        <div class="info-box">


            <h3>
                シェア可能期間
            </h3>


            <p id="sharePeriod">

                読み込み中...

            </p>


            <p id="shareConditions">

                シェア条件を読み込み中...

            </p>

        </div>


        <!-- ====================================
             エラーメッセージ
        ==================================== -->

        <div
            id="errorMessage"
            class="error-message">
        </div>


        <!-- ====================================
             利用開始日時
        ==================================== -->

        <div class="form-group">


            <label for="startDatetime">

                利用開始日時

            </label>


            <input
                type="datetime-local"
                id="startDatetime"
                required>

        </div>


        <!-- ====================================
             利用終了日時
        ==================================== -->

        <div class="form-group">


            <label for="endDatetime">

                利用終了日時

            </label>


            <input
                type="datetime-local"
                id="endDatetime"
                required>

        </div>


        <!-- ====================================
             計算結果
        ==================================== -->

        <div class="result-box">


            <!-- 利用時間 -->

            <div class="result-row">

                <span>

                    利用時間

                </span>


                <strong id="usageHours">

                    0時間

                </strong>

            </div>


            <!-- 利用料金 -->

            <div class="result-row">

                <span>

                    利用料金

                </span>


                <strong
                    id="sharePrice"
                    class="price">

                    0円

                </strong>

            </div>

        </div>


        <!-- ====================================
             申込みボタン
        ==================================== -->

        <button
            type="button"
            id="submitButton"
            class="submit-button">

            この内容で申し込む

        </button>


        <!-- ====================================
             戻るボタン
        ==================================== -->

        <a
            href="javascript:history.back()"
            class="back-button">

            ← ペット詳細に戻る

        </a>

    </div>


    <!-- ========================================
         JavaScript
    ======================================== -->

    <script src="borrow-request.js"></script>
    <script src="common-menu.js"></script>
    <script src="bottom-nav.js"></script>

</body>

</html>
