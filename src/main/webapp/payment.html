<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>支払い方法 - ペットシェアアプリ</title>

    <link
        rel="stylesheet"
        href="payment.css"
    >

</head>

<body>

<header class="header">

    <button
        type="button"
        id="backButton"
        class="back-button"
        aria-label="戻る"
    >
        ←
    </button>

    <h1>
        支払い方法
    </h1>

</header>


<main class="main-content">


    <!-- 登録済み -->

    <section class="section">

        <h2 class="section-title">
            登録済みの支払い方法
        </h2>


        <div
            id="paymentList"
            class="payment-list"
        >

            <div class="empty-card">

                <span class="empty-icon">
                    💳
                </span>

                <p>
                    支払い方法が登録されていません。
                </p>

            </div>

        </div>

    </section>


    <!-- 追加 -->

    <section class="section">

        <button
            type="button"
            id="addPaymentButton"
            class="add-button"
        >
            ＋ 支払い方法を追加
        </button>

    </section>


    <!-- カード入力 -->

    <section
        id="paymentForm"
        class="form-card hidden"
    >

        <h2>
            支払い方法を追加
        </h2>


        <div class="form-group">

            <label for="cardName">
                カード名義
            </label>

            <input
                type="text"
                id="cardName"
                placeholder="TARO YAMADA"
            >

        </div>


        <div class="form-group">

            <label for="cardNumber">
                カード番号
            </label>

            <input
                type="text"
                id="cardNumber"
                placeholder="0000 0000 0000 0000"
                inputmode="numeric"
                maxlength="19"
            >

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="expiry">
                    有効期限
                </label>

                <input
                    type="text"
                    id="expiry"
                    placeholder="MM / YY"
                    maxlength="7"
                >

            </div>


            <div class="form-group">

                <label for="securityCode">
                    セキュリティコード
                </label>

                <input
                    type="password"
                    id="securityCode"
                    placeholder="000"
                    maxlength="4"
                    inputmode="numeric"
                >

            </div>

        </div>


        <p class="security-note">
            ※ 現在は画面確認用です。カード情報は保存されません。
        </p>


        <button
            type="button"
            id="savePaymentButton"
            class="save-button"
        >
            登録する
        </button>

    </section>

</main>


<script src="payment.js"></script>

</body>

</html>
