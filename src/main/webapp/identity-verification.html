<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>本人確認 - ペットシェアアプリ</title>

    <link
        rel="stylesheet"
        href="identity-verification.css"
    >

</head>


<body>


<!-- ========================================
     ヘッダー
======================================== -->

<header class="header">

    <button
        type="button"
        id="backButton"
        class="back-button"
        aria-label="戻る"
    >
        ←
    </button>


    <h1>
        本人確認
    </h1>

</header>



<!-- ========================================
     メイン
======================================== -->

<main class="main-content">


    <!-- ====================================
         本人確認説明
    ==================================== -->

    <section class="verification-card">

        <!-- アイコン -->

        <div class="verification-icon">
            🪪
        </div>


        <!-- タイトル -->

        <h2>
            本人確認について
        </h2>


        <!-- 説明 -->

        <p class="description">
            安心してペットのシェアを利用していただくため、
            本人確認をお願いしています。
        </p>



        <!-- =================================
             必要なもの
        ================================= -->

        <div class="info-box">

            <h3>
                本人確認に必要なもの
            </h3>


            <ul>

                <li>
                    顔写真付きの本人確認書類
                </li>

                <li>
                    登録した氏名・生年月日
                </li>

            </ul>

        </div>



        <!-- =================================
             本人確認についての注意
        ================================= -->

        <div class="notice">

            <span>
                🔒
            </span>

            <p>
                本人確認情報は安全に管理されます。
            </p>

        </div>



        <!-- =================================
             本人確認開始
        ================================= -->

        <button
            type="button"
            id="startButton"
            class="start-button"
        >
            本人確認を開始する
        </button>


        <p class="screen-note">
            ※ 現在は画面確認用です。
        </p>

    </section>



    <!-- ====================================
         本人確認完了
    ==================================== -->

    <section
        id="completedCard"
        class="completed-card hidden"
    >

        <div class="completed-icon">
            ✓
        </div>


        <h2>
            本人確認済み
        </h2>


        <p>
            本人確認が完了しています。
        </p>


        <!--
            本人確認完了後、
            ペット知識テストへ進む
        -->

        <button
            type="button"
            id="testButton"
            class="start-button"
        >
            ペット知識テストへ進む
        </button>

    </section>


</main>



<!-- ========================================
     JavaScript
======================================== -->

<script src="identity-verification.js"></script>


</body>

</html>
