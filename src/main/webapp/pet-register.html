<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ペット登録 | Pet Share</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/design.css">

    <style>
        body {
            background-color: #f7f7f7;
        }

        .register-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 30px;
            text-align: center;
        }

        h2 {
            margin-top: 35px;
            margin-bottom: 20px;
            padding: 10px;
            border-left: 5px solid #333;
            background: #f2f2f2;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .required {
            color: red;
            margin-left: 5px;
        }

        .button-area {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .register-button {
            background-color: #333;
            color: white;
        }

        .back-button {
            background-color: #ddd;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="register-container">

    <h1>ペット登録</h1>

   <form
    action="pet-register"
    method="post"
    enctype="multipart/form-data"
>

        <!-- ========================= -->
        <!-- 基本情報 -->
        <!-- ========================= -->

        <h2>基本情報</h2>

        <div class="form-group">
            <label for="petName">
                ペットの名前<span class="required">*</span>
            </label>
            <input type="text"
                   id="petName"
                   name="petName"
                   maxlength="50"
                   required>
        </div>

        <div class="form-group">
            <label for="petImage">ペット画像</label>

    <input
        type="file"
        id="petImage"
        name="petImage"
        accept="image/*"
    >

    <div class="pet-image-preview">
        <img
            id="petImagePreview"
            alt="ペット画像プレビュー"
        >
    </div>
</div>

        <div class="form-group">
            <label for="petType">
                種類<span class="required">*</span>
            </label>

            <select id="petType" name="petType" required>
                <option value="">選択してください</option>
                <option value="犬">犬</option>
                <option value="猫">猫</option>
                <option value="その他">その他</option>
            </select>
        </div>

        <div class="form-group">
            <label for="breed">品種</label>
            <input type="text"
                   id="breed"
                   name="breed"
                   maxlength="50">
        </div>

        <div class="form-group">
            <label for="gender">性別</label>

            <select id="gender" name="gender">
                <option value="">選択してください</option>
                <option value="オス">オス</option>
                <option value="メス">メス</option>
            </select>
        </div>

        <div class="form-group">
            <label for="birthDate">生年月日</label>

            <input type="date"
                   id="birthDate"
                   name="birthDate">
        </div>

        <div class="form-group">
            <label for="weight">体重（kg）</label>

            <input type="number"
                   id="weight"
                   name="weight"
                   min="0"
                   step="0.01">
        </div>


        <!-- ========================= -->
        <!-- 性格・特徴 -->
        <!-- ========================= -->

        <h2>性格・特徴</h2>

        <div class="form-group">
            <label for="personality">性格</label>

            <textarea id="personality"
                      name="personality"
                      maxlength="300"
                      placeholder="例：人懐っこく、元気な性格です。"></textarea>
        </div>

        <div class="form-group">
            <label for="features">特徴</label>

            <textarea id="features"
                      name="features"
                      maxlength="500"></textarea>
        </div>

        <div class="form-group">
            <label for="likes">好きなもの</label>

            <textarea id="likes"
                      name="likes"
                      maxlength="500"
                      placeholder="例：ボール遊び、おやつ"></textarea>
        </div>

        <div class="form-group">
            <label for="dislikes">苦手なもの</label>

            <textarea id="dislikes"
                      name="dislikes"
                      maxlength="500"></textarea>
        </div>


        <!-- ========================= -->
        <!-- 相性 -->
        <!-- ========================= -->

        <h2>他の動物・子どもとの相性</h2>

        <div class="form-group">
            <label for="otherAnimals">他の動物との相性</label>

            <input type="text"
                   id="otherAnimals"
                   name="otherAnimals"
                   maxlength="100"
                   placeholder="例：犬は大丈夫、猫は苦手">
        </div>

        <div class="form-group">
            <label for="childrenCompatibility">
                子どもとの相性
            </label>

            <select id="childrenCompatibility"
                    name="childrenCompatibility">

                <option value="">選択してください</option>
                <option value="良い">良い</option>
                <option value="普通">普通</option>
                <option value="苦手">苦手</option>

            </select>
        </div>


        <!-- ========================= -->
        <!-- お世話情報 -->
        <!-- ========================= -->

        <h2>お世話情報</h2>

        <div class="form-group">
            <label for="foodInfo">食事</label>

            <textarea id="foodInfo"
                      name="foodInfo"
                      maxlength="500"></textarea>
        </div>

        <div class="form-group">
            <label for="walkInfo">散歩</label>

            <textarea id="walkInfo"
                      name="walkInfo"
                      maxlength="500"></textarea>
        </div>

        <div class="form-group">
            <label for="toiletInfo">トイレ</label>

            <textarea id="toiletInfo"
                      name="toiletInfo"
                      maxlength="300"></textarea>
        </div>

        <div class="form-group">
            <label for="aloneTime">留守番可能時間</label>

            <input type="text"
                   id="aloneTime"
                   name="aloneTime"
                   maxlength="100"
                   placeholder="例：4時間程度">
        </div>

        <div class="form-group">
            <label for="careInfo">その他のお世話</label>

            <textarea id="careInfo"
                      name="careInfo"
                      maxlength="500"></textarea>
        </div>


        <!-- ========================= -->
        <!-- 健康・安全 -->
        <!-- ========================= -->

        <h2>健康・安全情報</h2>

        <div class="form-group">
            <label for="vaccination">ワクチン接種</label>

            <select id="vaccination"
                    name="vaccination">

                <option value="">選択してください</option>
                <option value="済">済</option>
                <option value="未接種">未接種</option>
                <option value="不明">不明</option>

            </select>
        </div>

        <div class="form-group">
            <label for="neutering">避妊・去勢</label>

            <select id="neutering"
                    name="neutering">

                <option value="">選択してください</option>
                <option value="済">済</option>
                <option value="未実施">未実施</option>
                <option value="不明">不明</option>

            </select>
        </div>

        <div class="form-group">
            <label for="medicalHistory">既往歴</label>

            <textarea id="medicalHistory"
                      name="medicalHistory"
                      maxlength="500"></textarea>
        </div>

        <div class="form-group">
            <label for="allergies">アレルギー</label>

            <textarea id="allergies"
                      name="allergies"
                      maxlength="500"></textarea>
        </div>

        <div class="form-group">
            <label for="medication">服用中の薬</label>

            <textarea id="medication"
                      name="medication"
                      maxlength="500"></textarea>
        </div>

        <div class="form-group">
            <label for="precautions">注意事項</label>

            <textarea id="precautions"
                      name="precautions"
                      maxlength="500"></textarea>
        </div>


        <!-- ========================= -->
        <!-- シェア情報 -->
        <!-- ========================= -->

        <h2>ペットシェア情報</h2>

        <div class="form-group">
            <label for="sharePrice">シェア料金（円）</label>

            <input type="number"
                   id="sharePrice"
                   name="sharePrice"
                   min="0">
        </div>

        <div class="form-group">
            <label for="shareStartDate">シェア開始日</label>

            <input type="date"
                   id="shareStartDate"
                   name="shareStartDate">
        </div>

        <div class="form-group">
            <label for="shareEndDate">シェア終了日</label>

            <input type="date"
                   id="shareEndDate"
                   name="shareEndDate">
        </div>

        <div class="form-group">
            <label for="shareConditions">シェア条件</label>

            <textarea id="shareConditions"
                      name="shareConditions"
                      maxlength="500"
                      placeholder="例：室内飼育限定、散歩必須など"></textarea>
        </div>


        <!-- ========================= -->
        <!-- ボタン -->
        <!-- ========================= -->

        <div class="button-area">

            <button type="button"
                    class="back-button"
                    onclick="history.back()">
                戻る
            </button>

            <button type="submit"
                    class="register-button">
                ペットを登録する
            </button>

        </div>

    </form>

</div>

</body>
</html>
