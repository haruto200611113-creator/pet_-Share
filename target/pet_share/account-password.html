<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>パスワード - ペットシェアアプリ</title>

    <link
        rel="stylesheet"
        href="account-password.css"
    >

</head>

<body>

<header class="header">

    <button
        type="button"
        id="backButton"
        class="back-button"
        aria-label="戻る"
    >
        ←
    </button>

    <h1>
        パスワード
    </h1>

</header>


<main class="main-content">

    <section class="form-card">

        <h2>
            パスワード変更
        </h2>

        <p class="description">
            セキュリティのため、現在のパスワードと新しいパスワードを入力してください。
        </p>


        <!-- 現在のパスワード -->

        <div class="form-group">

            <label for="currentPassword">
                現在のパスワード
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="currentPassword"
                    placeholder="現在のパスワード"
                >

                <button
                    type="button"
                    class="show-button"
                    data-target="currentPassword"
                >
                    表示
                </button>

            </div>

        </div>


        <!-- 新しいパスワード -->

        <div class="form-group">

            <label for="newPassword">
                新しいパスワード
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="newPassword"
                    placeholder="新しいパスワード"
                >

                <button
                    type="button"
                    class="show-button"
                    data-target="newPassword"
                >
                    表示
                </button>

            </div>

            <p class="input-note">
                8文字以上で設定してください。
            </p>

        </div>


        <!-- 新しいパスワード確認 -->

        <div class="form-group">

            <label for="confirmPassword">
                新しいパスワード（確認）
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="もう一度入力してください"
                >

                <button
                    type="button"
                    class="show-button"
                    data-target="confirmPassword"
                >
                    表示
                </button>

            </div>

        </div>


        <button
            type="button"
            id="saveButton"
            class="save-button"
        >
            パスワードを変更する
        </button>

    </section>

</main>


<script src="account-password.js"></script>

</body>

</html>
