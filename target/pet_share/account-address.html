<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>住所 - ペットシェアアプリ</title>

    <link
        rel="stylesheet"
        href="account-address.css"
    >
</head>

<body>

<header class="header">

    <button
        type="button"
        id="backButton"
        class="back-button"
        aria-label="戻る"
    >
        ←
    </button>

    <h1>住所</h1>

</header>


<main class="main-content">

    <section class="form-card">

        <h2>住所情報</h2>

        <p class="description">
            シェア利用時などに使用する住所を登録してください。
        </p>


        <div class="form-group">

            <label for="postalCode">
                郵便番号
            </label>

            <input
                type="text"
                id="postalCode"
                placeholder="例：750-0000"
                inputmode="numeric"
            >

        </div>


        <div class="form-group">

            <label for="prefecture">
                都道府県
            </label>

            <select id="prefecture">

                <option value="">
                    選択してください
                </option>

                <option>北海道</option>
                <option>青森県</option>
                <option>岩手県</option>
                <option>宮城県</option>
                <option>秋田県</option>
                <option>山形県</option>
                <option>福島県</option>
                <option>茨城県</option>
                <option>栃木県</option>
                <option>群馬県</option>
                <option>埼玉県</option>
                <option>千葉県</option>
                <option>東京都</option>
                <option>神奈川県</option>
                <option>新潟県</option>
                <option>富山県</option>
                <option>石川県</option>
                <option>福井県</option>
                <option>山梨県</option>
                <option>長野県</option>
                <option>岐阜県</option>
                <option>静岡県</option>
                <option>愛知県</option>
                <option>三重県</option>
                <option>滋賀県</option>
                <option>京都府</option>
                <option>大阪府</option>
                <option>兵庫県</option>
                <option>奈良県</option>
                <option>和歌山県</option>
                <option>鳥取県</option>
                <option>島根県</option>
                <option>岡山県</option>
                <option>広島県</option>
                <option>山口県</option>
                <option>徳島県</option>
                <option>香川県</option>
                <option>愛媛県</option>
                <option>高知県</option>
                <option>福岡県</option>
                <option>佐賀県</option>
                <option>長崎県</option>
                <option>熊本県</option>
                <option>大分県</option>
                <option>宮崎県</option>
                <option>鹿児島県</option>
                <option>沖縄県</option>

            </select>

        </div>


        <div class="form-group">

            <label for="city">
                市区町村
            </label>

            <input
                type="text"
                id="city"
                placeholder="例：下関市"
            >

        </div>


        <div class="form-group">

            <label for="address">
                番地
            </label>

            <input
                type="text"
                id="address"
                placeholder="例：○○町1-2-3"
            >

        </div>


        <div class="form-group">

            <label for="building">
                建物名・部屋番号
                <span>任意</span>
            </label>

            <input
                type="text"
                id="building"
                placeholder="例：○○マンション101号室"
            >

        </div>


        <button
            type="button"
            id="saveButton"
            class="save-button"
        >
            保存する
        </button>

    </section>

</main>


<script src="account-address.js"></script>

</body>

</html>
