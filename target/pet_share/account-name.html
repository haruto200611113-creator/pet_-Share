<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>氏名 - ペットシェアアプリ</title>

    <link
        rel="stylesheet"
        href="account-name.css"
    >

</head>

<body>

<header class="header">

    <button
        type="button"
        id="backButton"
        class="back-button"
    >
        ←
    </button>

    <h1>
        氏名
    </h1>

</header>


<main class="main-content">

    <section class="form-card">

        <h2>
            氏名の変更
        </h2>

        <p class="description">
            本人確認などで使用する氏名を入力してください。
        </p>


        <div class="form-group">

            <label for="name">
                氏名
            </label>

            <input
                type="text"
                id="name"
                placeholder="例：山田 太郎"
            >

        </div>


        <button
            type="button"
            id="saveButton"
            class="save-button"
        >
            保存する
        </button>

    </section>

</main>


<script src="account-name.js"></script>

</body>

</html>
