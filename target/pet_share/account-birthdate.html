<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>生年月日 - ペットシェアアプリ</title>

    <link
        rel="stylesheet"
        href="account-birthdate.css"
    >

</head>

<body>

<header class="header">

    <button
        type="button"
        id="backButton"
        class="back-button"
    >
        ←
    </button>

    <h1>
        生年月日
    </h1>

</header>


<main class="main-content">

    <section class="form-card">

        <h2>
            生年月日の変更
        </h2>

        <p class="description">
            登録する生年月日を選択してください。
        </p>


        <div class="form-group">

            <label for="birthDate">
                生年月日
            </label>

            <input
                type="date"
                id="birthDate"
            >

        </div>


        <button
            type="button"
            id="saveButton"
            class="save-button"
        >
            保存する
        </button>

    </section>

</main>


<script src="account-birthdate.js"></script>

</body>

</html>
