<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>性別 - ペットシェアアプリ</title>

    <link
        rel="stylesheet"
        href="account-gender.css"
    >

</head>

<body>

<header class="header">

    <button
        type="button"
        id="backButton"
        class="back-button"
    >
        ←
    </button>

    <h1>
        性別
    </h1>

</header>


<main class="main-content">

    <section class="form-card">

        <h2>
            性別の変更
        </h2>

        <p class="description">
            性別を選択してください。
        </p>


        <div class="gender-list">

            <label class="gender-option">

                <input
                    type="radio"
                    name="gender"
                    value="男性"
                >

                <span>
                    男性
                </span>

            </label>


            <label class="gender-option">

                <input
                    type="radio"
                    name="gender"
                    value="女性"
                >

                <span>
                    女性
                </span>

            </label>


            <label class="gender-option">

                <input
                    type="radio"
                    name="gender"
                    value="その他"
                >

                <span>
                    その他
                </span>

            </label>


            <label class="gender-option">

                <input
                    type="radio"
                    name="gender"
                    value="回答しない"
                >

                <span>
                    回答しない
                </span>

            </label>

        </div>


        <button
            type="button"
            id="saveButton"
            class="save-button"
        >
            保存する
        </button>

    </section>

</main>


<script src="account-gender.js"></script>

</body>

</html>
